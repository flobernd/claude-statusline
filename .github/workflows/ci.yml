name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        # Runners spawn processes slowly enough, and run tests concurrently
        # enough, that the render-time git budget can expire on a healthy
        # repository. Raise it so a timeout here means a real hang.
        env:
          CLAUDE_STATUSLINE_GIT_TIMEOUT_MS: 10000
